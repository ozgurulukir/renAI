[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renai"
version = "2.3.0"
description = "AI-powered digital file renamer and organizer using LLMs and OCR"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ozgur Ulukir", email = "ozgur.ulukir@gmail.com"},
]
keywords = ["ai", "llm", "ocr", "pdf", "book", "renamer", "organizer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
]

dependencies = [
    "pymupdf",
    "pytesseract",
    "Pillow",
    "requests",
    "markitdown",
    "openai",
    "numpy",
    "opencv-python",
    "rich",
    "typer",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog",
    "platformdirs",
    "colorama",
    "tomli; python_version < '3.11'",
    "tomli-w",
    "questionary>=2.1.1",
]

[project.urls]
Homepage = "https://github.com/ozgurulukir/renAI"
Repository = "https://github.com/ozgurulukir/renAI"
Issues = "https://github.com/ozgurulukir/renAI/issues"

[project.optional-dependencies]
pdf-extra = [
    "pdfplumber",
    "pypdf",
    "pypdfium2",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

lint = [
    "ruff",
    "mypy",
    "pyright>=1.1.409",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pypdf",
    "tomli",
    "pdfplumber",
    "pypdfium2",
    "pyright>=1.1.409",
]

[project.scripts]
renai = "renai.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "C90", # mccabe complexity
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # erradicate (dead code)
    "PL",  # pylint
    "RUF", # ruff-specific
]
ignore = [
    "T201", # Allow print() in CLI
    "PLR0913", # Allow many arguments (common in orchestrators)
    "RUF001",  # Allow Turkish characters (dotless i, etc.)
    "PLC0415", # Allow local imports (often used for lazy loading or to avoid circularity)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004", # Magic values are fine in tests
    "ERA001",  # Commented out code often used for examples in tests
    "ARG001",  # Unused function arguments (common in mocks/fixtures)
    "ARG002",  # Unused method arguments
    "ARG005",  # Unused lambda arguments (common in mocks)
    "S101",    # Use of assert
    "E501",    # Long lines are common in tests (docstrings, examples)
    "PTH",     # Path suggestions not strictly needed in tests
    "RUF033",  # Regex warning in match=
    "RUF043",  # Regex warning in match=
    "SIM117",  # Nested with statements are common in mocking
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["renai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]


