name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install mupdf-tools (mutool for render characterization tests)
        run: sudo apt-get update && sudo apt-get install -y mupdf-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=src/renai --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          version: "v10.0.1"
          flags: unittests
          name: renAI

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: uv sync --frozen --group lint

      - name: Run ruff (linting)
        run: uv run ruff check src/ tests/

      - name: Run ruff (formatting)
        run: uv run ruff format --check src/ tests/

      - name: Run pyright (type checking)
        run: uv run pyright src/renai

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Verify package
        run: |
          pip install dist/*.whl
          renai --help
          python -c "
          from pathlib import Path
          import renai
          pkg = Path(renai.__file__).resolve().parent
          prompts = list((pkg / 'prompts').glob('*.txt'))
          tomls = list((pkg / 'config').glob('*.default.toml'))
          assert prompts, 'Missing bundled prompt templates'
          assert tomls, 'Missing bundled default TOML configs'
          print(f'Verified {len(prompts)} prompt templates and {len(tomls)} default TOML files')
          "
          python -c "
          import glob, tarfile
          sdists = glob.glob('dist/*.tar.gz')
          assert len(sdists) == 1, f'Expected 1 sdist, found {sdists}'
          with tarfile.open(sdists[0], 'r:gz') as tf:
              names = tf.getnames()
          forbidden = ('.opencode/', '.gitnexus/', '.rumdl_cache/', '/tests/', '/.github/')
          bad = [n for n in names if any(f in n for f in forbidden)]
          assert not bad, f'Forbidden entries in sdist: {bad[:10]}'
          print(f'Verified sdist ({len(names)} entries) is clean')
          "

