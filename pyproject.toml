[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renai"
version = "1.3.1"
description = "AI-Powered Book Renamer and Organizer"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ozgur Ulukir", email = "ozgur.ulukir@gmail.com"},
]
keywords = ["ai", "llm", "ocr", "pdf", "book", "renamer", "organizer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
]

dependencies = [
    "pymupdf",
    "pytesseract",
    "Pillow",
    "requests",
    "markitdown",
    "openai",
    "numpy",
    "opencv-python",
    "rich",
    "typer",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog",
    "platformdirs",
    "colorama",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ozgurulukir/renAI"
Repository = "https://github.com/ozgurulukir/renAI"
Issues = "https://github.com/ozgurulukir/renAI/issues"

[project.optional-dependencies]
pdf-extra = [
    "pdfplumber",
    "pypdf",
    "pypdfium2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pypdf",
    "tomli",
    "pdfplumber",
    "pypdfium2",
]

[project.scripts]
renai = "renai.cli:app"


