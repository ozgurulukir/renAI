# =============================================================================
# Default Evaluation Models for renAI
# =============================================================================
# This file is shipped with the package
# User can override by creating eval_models.toml in config directory

[deepinfra]
models = [
    "meta-llama/Llama-3.3-70B-Instruct",
    "meta-llama/Llama-3.2-90B-Vision-Instruct",
    "Qwen/Qwen2-VL-72B-Instruct",
    "Qwen/Qwen2-VL-7B-Instruct",
    "microsoft/Phi-3.5-vision-instruct",
    "google/gemini-2.0-flash-exp",
    "deepseek-ai/DeepSeek-V3",
]

[openrouter]
models = [
    "openai/gpt-4o",
    "openai/gpt-4o-mini",
    "google/gemini-2.0-flash-exp",
    "anthropic/claude-3.5-sonnet",
    "meta-llama/llama-3.2-90b-vision-instruct",
]

[openai]
models = [
    "gpt-4o",
    "gpt-4o-mini",
    "gpt-4-turbo",
    "gpt-3.5-turbo",
    "gpt-4o-preview",
]
